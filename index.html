<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة القراصنة - المرحلة 1</title>
<style>
:root{--sea:#0e5a7a;--sky:#f6c26b;--wood:#8a5a2b;--ink:#1d1a16;--hud:#fff7e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--ink:#0b0a08}}
html,body{height:100%;margin:0;background:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{display:flex;flex-direction:column;height:100%}
#hud{display:flex;justify-content:space-between;padding:8px 14px;color:var(--hud);font-weight:700;font-size:15px}
canvas{flex:1;width:100%;min-height:0;display:block}
#ctl{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 14px}
.pad{display:flex;gap:10px}
button{width:68px;height:68px;border-radius:50%;border:3px solid #fff7e6;background:#b3261e;color:#fff;font-size:17px;font-weight:800;touch-action:none}
button.m{background:#3a3226;width:62px;height:62px;font-size:26px}
button:focus-visible{outline:3px solid #f6c26b}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>المرحلة 1: سطح السفينة</span><span id="sc">البراميل: 0 / 5</span></div>
  <canvas id="c"></canvas>
  <div id="ctl">
    <div class="pad"><button class="m" id="L">◀</button><button class="m" id="R">▶</button></div>
    <div class="pad"><button class="m" id="J">▲</button><button id="P">لكمة</button></div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,S;
function fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;W=cv.width;H=cv.height;S=H/360}
addEventListener('resize',fit);fit();
const keys={l:0,r:0,j:0,p:0};
function hold(id,k){const e=document.getElementById(id);
 ['pointerdown'].forEach(t=>e.addEventListener(t,ev=>{ev.preventDefault();keys[k]=1}));
 ['pointerup','pointerleave','pointercancel'].forEach(t=>e.addEventListener(t,()=>keys[k]=0))}
hold('L','l');hold('R','r');hold('J','j');hold('P','p');
addEventListener('keydown',e=>{if(e.key=='ArrowLeft')keys.l=1;if(e.key=='ArrowRight')keys.r=1;if(e.key=='ArrowUp')keys.j=1;if(e.key==' '||e.key=='x')keys.p=1});
addEventListener('keyup',e=>{if(e.key=='ArrowLeft')keys.l=0;if(e.key=='ArrowRight')keys.r=0;if(e.key=='ArrowUp')keys.j=0;if(e.key==' '||e.key=='x')keys.p=0});

const GY=260, WORLD=900;
const me={x:80,y:GY,vy:0,dir:1,punch:0,cool:0};
let barrels=[[300],[470],[620],[760],[850]].map((a,i)=>({x:a[0],hit:false,vy:0,vx:0,y:GY,fly:0}));
let score=0,t=0,won=false,cam=0;

function update(){
 t++;
 if(keys.l){me.x-=3;me.dir=-1}
 if(keys.r){me.x+=3;me.dir=1}
 me.x=Math.max(20,Math.min(WORLD-20,me.x));
 if(keys.j&&me.y>=GY){me.vy=-9}
 me.vy+=0.5;me.y+=me.vy;if(me.y>GY){me.y=GY;me.vy=0}
 if(keys.p&&me.cool==0&&me.punch==0){me.punch=1;me.cool=25}
 if(me.cool>0)me.cool--;
 if(me.punch>0){me.punch+=me.punch<10?1.5:-1.2;if(me.punch<=0.5)me.punch=0}
 const reach=me.punch*14;
 barrels.forEach(b=>{
  if(!b.hit&&me.punch>2){const hx=me.x+me.dir*(reach+20);
   if(Math.abs(hx-b.x)<24&&Math.abs(me.y-b.y)<40){b.hit=true;b.vx=me.dir*5;b.vy=-8;score++;
    document.getElementById('sc').textContent='البراميل: '+score+' / 5';if(score>=5)won=true}}
  if(b.hit){b.x+=b.vx;b.y+=b.vy;b.vy+=0.5;b.fly++}
 });
 cam=Math.max(0,Math.min(WORLD-W/S,me.x-W/S/2));
}
function body(x,y,dir){
 // original pirate: red vest, round straw-style hat
 g.fillStyle='#e0ac7a';g.beginPath();g.arc(x,y-46,12,0,7);g.fill();
 g.fillStyle='#b3261e';g.fillRect(x-11,y-36,22,24);
 g.fillStyle='#2b4a8a';g.fillRect(x-10,y-12,8,12);g.fillRect(x+2,y-12,8,12);
 g.fillStyle='#e8c35a';g.beginPath();g.ellipse(x,y-54,20,5,0,0,7);g.fill();
 g.beginPath();g.arc(x,y-56,11,Math.PI,0);g.fill();
 g.fillStyle='#b3261e';g.fillRect(x-11,y-59,22,3);
 g.fillStyle='#1d1a16';g.fillRect(x+dir*4-1,y-48,3,4);
}
function draw(){
 g.setTransform(S,0,0,S,0,0);
 const vw=W/S;
 let gr=g.createLinearGradient(0,0,0,360);gr.addColorStop(0,'#f6c26b');gr.addColorStop(.55,'#f08a4b');gr.addColorStop(1,'#0e5a7a');
 g.fillStyle=gr;g.fillRect(0,0,vw,360);
 g.fillStyle='#ffe9b0';g.beginPath();g.arc(vw*0.75,110,34,0,7);g.fill();
 g.fillStyle='#0e5a7a';
 for(let i=0;i<8;i++){const y=210+i*14;g.globalAlpha=.5;g.beginPath();
  for(let x=0;x<=vw;x+=10)g.lineTo(x,y+Math.sin((x+t*(1+i*.2)+cam)/18+i)*3);
  g.lineTo(vw,360);g.lineTo(0,360);g.fill()}
 g.globalAlpha=1;
 g.save();g.translate(-cam,0);
 // deck
 g.fillStyle='#8a5a2b';g.fillRect(0,GY,WORLD,100);
 g.fillStyle='#6b4220';for(let x=0;x<WORLD;x+=40)g.fillRect(x,GY,3,100);
 g.fillStyle='#4e2f14';g.fillRect(0,GY,WORLD,6);
 // mast
 g.fillStyle='#5b3a1a';g.fillRect(WORLD/2-6,40,12,GY-40);
 g.fillStyle='#f4ead2';g.beginPath();g.moveTo(WORLD/2+6,50);g.lineTo(WORLD/2+110,110);g.lineTo(WORLD/2+6,170);g.fill();
 // barrels
 barrels.forEach(b=>{if(b.fly>60)return;g.save();g.translate(b.x,b.y);g.rotate(b.fly*.2);
  g.fillStyle='#a8742f';g.fillRect(-14,-34,28,34);g.fillStyle='#3a2410';g.fillRect(-14,-26,28,3);g.fillRect(-14,-10,28,3);g.restore()});
 // arm
 if(me.punch>0){const r=me.punch*14;g.strokeStyle='#e0ac7a';g.lineWidth=7;g.lineCap='round';
  g.beginPath();g.moveTo(me.x+me.dir*8,me.y-28);g.lineTo(me.x+me.dir*(r+14),me.y-28);g.stroke();
  g.fillStyle='#e0ac7a';g.beginPath();g.arc(me.x+me.dir*(r+18),me.y-28,10,0,7);g.fill()}
 body(me.x,me.y,me.dir);
 g.restore();
 if(won){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,130,vw,100);g.fillStyle='#fff7e6';g.font='bold 26px sans-serif';g.textAlign='center';
  g.fillText('اكتملت المرحلة 1!',vw/2,175);g.font='16px sans-serif';g.fillText('بانتظار موافقتك للانتقال للمرحلة 2',vw/2,205)}
}
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
</body>
</html>
